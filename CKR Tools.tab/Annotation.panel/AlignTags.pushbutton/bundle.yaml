title: Align Tags
tooltip: "Align tags and leadered text notes to a picked point: heads stack at the set spacing, leaders become straight/L-bent/parallel per your angle, ordered by pipe position. Selections auto-split into pipe bundles, one pick each; overlaps are resolved automatically at the end.\n\nCLICK: run with the last-used settings.\nSHIFT+CLICK: open the settings dialog."
author: Naveen
