title: Align Tags
tooltip: "Align tags and leadered text notes to a picked point: heads stack at the set vertical spacing, leaders become parallel at the set angle with straight landing lines. Supports element/material/keynote tags, room/space/area tags and text notes.\n\nCLICK: run with the last-used settings.\nSHIFT+CLICK: open the settings dialog."
author: Naveen
